name: Bug report
description: Report reproducible incorrect behavior.
title: "bug: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: Do not paste credentials, registry files, `agy-auth env` output, or exports created with `--include-secrets`.
  - type: input
    id: version
    attributes:
      label: agy-auth version
      placeholder: 0.1.0
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      placeholder: macOS 15, Node.js 24.3.0, zsh
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Reproduction steps
      description: Use fake or generated credentials.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: checkboxes
    id: secret-check
    attributes:
      label: Secret check
      options:
        - label: I removed API keys, tokens, service-account keys, ADC data, personal paths, and private exports.
          required: true
